spring.application.name=Defect-Tracker-BE

# Server Configuration
server.port=8087

# PostgreSQL Datasource Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/DefectTrackerAI1}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway Configuration (disabled for dynamic JPA sync)
spring.flyway.enabled=false

# Jackson JSON Serialization
spring.jackson.time-zone=UTC

# Logging Configuration
logging.level.com.sgic.Defect_Tracker_BE=INFO
logging.level.org.springframework.web=INFO
